name: Deploy Sencus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: senus/package-lock.json
      - name: Install Sencus
        working-directory: senus
        run: npm ci
      - name: Build Sencus
        working-directory: senus
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_ORIGIN: https://sencus.com
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: senus/out
          branch: gh-pages
          clean: true
          cname: sencus.com
